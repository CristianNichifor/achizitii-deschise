name: daily ingest (SEAP line items)

on:
  schedule:
    # 04:20 UTC — after SEAP has settled the previous day.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: false
      end:
        description: "End date (YYYY-MM-DD)"
        required: false
      limit:
        description: "Cap records per day (smoke test only)"
        required: false

# Never two writers on state/ or the data branch.
concurrency:
  group: ingest-seap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Ingest
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.start }}" ]; then
            ARGS+=(--start "${{ inputs.start }}")
            [ -n "${{ inputs.end }}" ] && ARGS+=(--end "${{ inputs.end }}")
          else
            ARGS+=(--days-back 1)
          fi
          [ -n "${{ inputs.limit }}" ] && ARGS+=(--limit "${{ inputs.limit }}")
          achizitii seap "${ARGS[@]}"

      - name: Summarise
        run: |
          python - <<'PY'
          import pathlib
          import duckdb
          if not list(pathlib.Path("site/data/items").rglob("*.parquet")):
              print("no data produced")
              raise SystemExit(0)
          duckdb.sql("""
            SELECT count(*) items,
                   sum(comparabil::INT) comparabile,
                   count(DISTINCT judet) judete,
                   count(DISTINCT cpv) cpv
            FROM 'site/data/items/**/*.parquet'
          """).show()
          PY

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: seap-${{ github.run_id }}
          path: |
            site/data/items
            data/core
          retention-days: 30
          if-no-files-found: warn

  # Publishing to Pages is intentionally NOT wired up: data quality is not yet
  # validated at scale, and nothing should go public by accident. Enable at Stage 1.
