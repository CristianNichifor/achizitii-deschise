name: Browser baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      # playwright.config.js serves site/ and the page reads site/data over HTTP, so without
      # this the baseline measures a page whose manifest 404s. The fetch script uses curl and
      # python3 rather than the GitHub CLI precisely because this container has no `gh`.
      - name: Fetch the bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch_bundle.sh

      - run: npm ci --ignore-scripts
      - run: npm run test:browser
        env:
          # Firefox requires HOME to belong to the container's current user.
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-baseline
          path: test-results/
          retention-days: 7
