name: bulk ingest and risk indicators

# DOES NOT WORK ON GITHUB-HOSTED RUNNERS.
#
# data.gov.ro does not accept connections from GitHub/Azure IP ranges. Measured
# 2026-09-06: four retries, each a 60s connect timeout, ~16 minutes total, zero bytes —
# while the identical request from a residential connection returned 200 in 0.93s.
#
# The scheduled trigger is therefore removed: it would fail every week and train
# everyone to ignore a red build. Run this on a self-hosted runner with a route to
# data.gov.ro, or ingest locally and publish the derived Parquet for CI to consume.
# See docs/sources.md.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to ingest, e.g. 2026 or 2016-2026"
        required: false
        default: "2026"
      runner:
        description: "Runner label — 'ubuntu-latest' cannot reach data.gov.ro"
        required: false
        default: "ubuntu-latest"

concurrency:
  group: ingest-bulk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bulk:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # Same reason as daily.yml: the bundle is a release asset and several tests read it
      # directly. This workflow is dispatch-only and last ran before the bundle moved, so it
      # has not failed yet — it would have, the next time someone reached for it.
      - name: Fetch the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch_bundle.sh

      - name: Test
        run: pytest -q

      # Downloads are large and immutable once published, so a hit here saves
      # several hundred MB of transfer from data.gov.ro every run.
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: data/gov_raw
          key: gov-raw-${{ inputs.years || '2026' }}-${{ github.run_id }}
          restore-keys: |
            gov-raw-${{ inputs.years || '2026' }}-
            gov-raw-

      - name: Ingest bulk exports
        run: achizitii gov --years "${{ inputs.years || '2026' }}"

      - name: Run indicators
        run: achizitii indicators > findings-summary.json

      - name: Report
        run: |
          python - <<'PY'
          import json
          import pathlib
          summary = json.loads(pathlib.Path("findings-summary.json").read_text())
          print(f"evaluated as of {summary['date']}\n")
          for r in summary["results"]:
              if "findings" in r:
                  print(f"  {r['indicator']:20} {r['findings']:>8,}  [{r['legal_basis']}]")
              else:
                  print(f"  {r['indicator']:20} SKIPPED: {r.get('skipped') or r.get('error')}")
          print(
              "\nFindings report PATTERNS REQUIRING REVIEW, never conclusions. "
              "See METHODOLOGY.md."
          )
          PY

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ github.run_id }}
          path: |
            data/findings
            findings-summary.json
          retention-days: 90
          if-no-files-found: warn
