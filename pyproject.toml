[project]
name = "achizitii-deschise"
version = "0.1.0"
description = "Open data on Romanian public procurement: comparable unit prices, OCDS format"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx[http2]>=0.27",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "xlwt>=1.3"]

[project.scripts]
achizitii = "achizitii.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/achizitii"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
