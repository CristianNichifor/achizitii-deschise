  - pet
  - inox
  - a4
  - a3

# Tokens that ARE real brands but collide with ordinary Romanian words, place names or
# abbreviations. Measured on a 600,000-row sample of direct-acquisition descriptions,
# bare matching on these was wrong far too often to use:
#
#   man       24.5% plausible — "DET.MAN.20KG" (detergent manual), "GAR.MAN.+SILD".
#                               Romanian abbreviates manual/manoperă as MAN.
#   lg        43.7% plausible — "LEUSTEAN RO. LG. C.I", "MARAR RO LG CI".
#                               Produce catalogues abbreviate legume as LG.
#   braun     63.9% plausible — "PROSOP ISABEL BRAUN 70X100CM" is a brown towel.
#   bucovina  68.4% plausible — a region: "Bucovina TV", "Centrul Cultural Bucovina".
#   tesa      70.4% plausible — TESA is also the standard staff category
#                               (tehnic, economic, socio-administrativ).
#   dorna     85.4% plausible — also a place: "Transport ... la Vatra Dorna si retur".
#
# Each is counted only when the description also names something the brand actually
# makes. This trades a little recall for precision, which is the right direction: these
# feed price-comparison groups, and a wrongly attributed brand splits or merges groups
# that should not be.
ambiguous:
  man: [camion, autocamion, autogunoiera, autobuz, autospeciala, tgl, tgs, tgx, tga,
        remorca, sasiu, etrier, turbo, autoutilitara, autovehicul, tractor]
  lg: [tv, monitor, ecran, display, led, lcd, oled, climatizare, aer conditionat,
       blu ray, dvd, frigider, telefon, hard, ssd, videoproiector, televizor]
  braun: [medical, solutie, fiola, perfuzie, seringa, cateter, propofol, clorura,
          metronidazol, sterofundin, aparat de ras, epilator, termometru, tensiometru]
  bucovina: [apa, minerala, lapte, smantana, cascaval, branza, iaurt, unt]
  tesa: [banda, adeziv, scotch, duct tape, lipit, etichete, fixare]
  dorna: [apa, minerala, lapte, uht, smantana, iaurt, unt, carbogazoasa]
  honor: [telefon, smartphone, tableta, mobil]
  certeze: [apa, minerala, plata, carbogazoasa]
