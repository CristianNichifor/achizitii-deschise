# Words that look like brands but are not: standards bodies, certifications and
# materials. Matching these as brands would produce false art. 156 findings on
# specifications that are entirely lawful.
not_brands:
  - iso
  - en
  - sr
  - astm
  - din
  - ce
  - ral
  - ip
  - usb
  - hdmi
  - led
