# Commercial brand gazetteer.
#
# Serves two purposes at once:
#
# 1. PRODUCT GROUPING. A CPV code is far too coarse to compare prices within.
#    30213100 ("computere portabile") covers both a budget netbook and a mobile
#    workstation, and the data contains "Laptop", "laptop", "LAPTOP", "Laptop Dell
#    Inspiron 3567 cu procesor Intel Core i5..." all under that one code. Averaging
#    them produces a number that describes nothing. The brand is the strongest
#    available signal for splitting a CPV into comparable groups.
#
# 2. A FUTURE ART. 156 CHECK — NOT CURRENTLY SHIPPED. Legea 98/2016 requires that
#    where a technical specification names a make, it carry "sau echivalent".
#    Detecting a brand without that phrase is deterministic and auditable, but it
#    needs the tender documents. Measured against direct-acquisition titles it does
#    not work at all: the phrase occurs in 0.04% of brand-naming descriptions, because
#    those titles are not specifications and have no qualifier to omit. See the
#    "Why there is no brand indicator" section in METHODOLOGY.md.
#
# Matching is on folded text (lowercase, diacritics stripped, punctuation removed) and
# requires a word boundary, so "hp" does not match inside "shpe" and "dell" does not
# match inside "adelle".
#
# Entries are lowercase. Multi-word brands are matched as phrases.

